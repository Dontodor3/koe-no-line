<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8f7">
  <meta name="description" content="自分の声の高さをその場で見ながら、英語のイントネーションを練習できます。">
  <title>声のライン | 英語イントネーション練習</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main class="workspace">
    <header class="masthead">
      <div class="brand">
        <img src="./icon-192.png" alt="" width="48" height="48">
        <div>
          <h1>声のライン</h1>
          <p>英語イントネーション練習</p>
        </div>
      </div>
      <span class="local"><span class="lock" aria-hidden="true"></span>音声は端末内で処理</span>
    </header>

    <section class="practice" aria-labelledby="practice-title">
      <h2 id="practice-title">練習するパターン</h2>
      <div class="patterns" role="group" aria-labelledby="practice-title">
        <button type="button" data-pattern="falling" aria-pressed="true"><canvas width="108" height="54" aria-hidden="true"></canvas><span>下降調</span></button>
        <button type="button" data-pattern="rising" aria-pressed="false"><canvas width="108" height="54" aria-hidden="true"></canvas><span>上昇調</span></button>
        <button type="button" data-pattern="dip" aria-pressed="false"><canvas width="108" height="54" aria-hidden="true"></canvas><span>下降上昇調</span></button>
        <button type="button" data-pattern="flat" aria-pressed="false"><canvas width="108" height="54" aria-hidden="true"></canvas><span>平坦調</span></button>
      </div>
      <div class="example">
        <span class="example-label">練習フレーズ</span>
        <strong id="example" lang="en">Yes.</strong>
        <span id="hint">高く始めて、語尾を下げます。</span>
      </div>
    </section>

    <section class="card" aria-labelledby="graph-title">
      <div class="card-head">
        <div>
          <h2 id="graph-title">声の高さ</h2>
          <p class="axis-note" id="axis-note">ふだんの声を 0 とした高さ</p>
        </div>
        <div class="status" id="status" data-state="idle" role="status"><span></span><b id="status-label">マイク停止中</b></div>
      </div>
      <div class="chart">
        <canvas id="graph" role="img" aria-label="横軸が秒、縦軸が声の高さのグラフ"></canvas>
      </div>
      <div class="legend">
        <span><i class="stroke actual"></i>自分の声</span>
        <span><i class="stroke model"></i><span id="guide-label">目標の形</span></span>
        <span id="ghost-legend" hidden><i class="stroke ghost"></i>前の発声</span>
      </div>
    </section>

    <div class="actions">
      <button class="microphone" id="microphone" type="button" data-state="idle"><span class="mic-icon" aria-hidden="true"></span><span id="microphone-label">マイクを開始</span></button>
      <div class="secondary">
        <button id="clear" type="button" disabled>グラフを消去</button>
        <button id="previous" type="button" disabled>前回の結果</button>
      </div>
    </div>
    <div class="feedback" id="feedback" role="status">
      <span class="feedback-mark" aria-hidden="true"></span>
      <div>
        <p id="feedback-title">マイクを開始して、声を出してみましょう。</p>
        <p id="feedback-detail">初回は、マイクの使用を「許可」してください。</p>
      </div>
    </div>

    <details class="settings">
      <summary>表示・マイク設定</summary>
      <div class="settings-body">
        <label>高さの表示
          <select id="unit">
            <option value="relative">相対表示</option>
            <option value="hz">周波数（Hz）</option>
          </select>
        </label>
        <label>検出する声の範囲
          <select id="range">
            <option value="normal">標準（65〜440 Hz）</option>
            <option value="low">低め（50〜300 Hz）</option>
            <option value="high">高め（105〜650 Hz）</option>
          </select>
        </label>
        <p>目標の線は、声の動かし方を練習するための見本です。検出範囲の変更は、次にマイクを開始したときに反映されます。</p>
      </div>
    </details>
    <noscript><p>このアプリを使うには、Chrome で JavaScript を有効にしてください。</p></noscript>
  </main>
</body>
</html>
